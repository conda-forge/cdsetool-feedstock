{% set name = "cdsetool" %}
{% set version = "0.3.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 3c90a7afb28b1ce7c57e32df2382412b06475a43225168e36eab0e7c740dddad

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0
  entry_points:
    - cdsetool = cdsetool:cli.main

requirements:
  build:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - typer >=0.9
    - rich >=13.6,<14
    - requests >=2.28.1
    - pyjwt >=2.8,<2.10
    - cryptography
    - geopandas >=0.13.2

test:
  imports:
    - cdsetool
  requires:
    - python {{ python_min }}
    - pip
  commands:
    - python -m pip check
    - cdsetool --help

about:
  home: https://github.com/CDSETool/CDSETool
  summary: 'Download data from the Copernicus Data Space Ecosystem (CDSE)'
  description: |
    CDSETool provides Python Tools and Command line Interface (CLI)
    programs for downloading Copernicus data from the Copernicus Data
    Space Ecosystem.
  license: MIT
  license_family: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - avalentino
